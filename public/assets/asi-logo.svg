<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="asiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2B857" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Hexagonal Tech Crest -->
  <polygon points="100,10 178,55 178,145 100,190 22,145 22,55" fill="none" stroke="url(#asiGrad)" stroke-width="3.5" filter="url(#glow)"/>
  
  <!-- Inner Concentric Node Circle -->
  <circle cx="100" cy="100" r="62" fill="none" stroke="rgba(226, 184, 87, 0.4)" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Analytics Bar/Chart Graph Motif -->
  <rect x="68" y="110" width="10" height="30" rx="2" fill="#E2B857" />
  <rect x="85" y="90" width="10" height="50" rx="2" fill="#D4AF37" />
  <rect x="102" y="70" width="10" height="70" rx="2" fill="#00F0FF" filter="url(#glow)" />
  <rect x="119" y="82" width="10" height="58" rx="2" fill="#70A1FF" />

  <!-- Trend Curve Line -->
  <path d="M 60,125 Q 90,85 135,60" fill="none" stroke="#00F0FF" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)" />

  <!-- Connection Nodes -->
  <circle cx="60" cy="125" r="4" fill="#E2B857"/>
  <circle cx="90" cy="95" r="4" fill="#D4AF37"/>
  <circle cx="135" cy="60" r="5" fill="#00F0FF" filter="url(#glow)"/>

  <!-- ASI Text Emblem -->
  <text x="100" y="168" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="800" font-size="16" fill="#FFFFFF" letter-spacing="4">ASI</text>
</svg>
